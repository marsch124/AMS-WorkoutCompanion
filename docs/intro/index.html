<title>Workouts Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Workouts Tour: chapter rail on the left, coach card + a pretend iPhone on the right. Same engine as the other AMS tours.
   Based on AMS Workouts (WorkoutCompanion) 1.21 (build 1). Update this tour in the release that changes a taught screen. */
:root {
  --bg: #F4F6F7; --panel: #FFFFFF; --fg: #16232A; --muted: #5F7078; --line: #E2E8EA;
  --accent: #4F46E5; --accent-soft: #E9E8FB; --good: #15803D; --good-soft: #E3F4E8; --warn: #C2410C;
  --shadow: 0 18px 40px rgba(22,35,42,.2);
  --pbg:#F4F6F7; --pcard:#FFFFFF; --pink:#16232A; --pmuted:#5F7078; --pline:#E2E8EA; --pfield:rgba(120,120,128,.14);
  --ind:#4F46E5; --gt:#4F46E5; --band:#1E1B4B; --bz:#FF8C1A; --bz-ink:#4A2300; --bzt:#C2410C;
  --plum:#9C3D8C; --plumt:#9C3D8C; --navy:#2A5194; --grn:#30D158; --grn-ink:#0B3A17; --sess:#15803D;
  --yel:#FFD60A; --yel-ink:#3D3000; --wut:#A16207; --gold:#B7791F; --acc:#2F6FE0; --red:#DC3D43; --blue:#0A84FF; --pink2:#FF6FA8; --pink2-ink:#5A0F2E;
  --f-display: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-phone: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0E1416; --panel:#161F22; --fg:#E7EDEE; --muted:#94A6AC; --line:#26343A;
  --accent:#9D97FF; --accent-soft:#23214A; --good:#86EFAC; --good-soft:#15301F; --warn:#FDBA74;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#0E1416; --pcard:#161F22; --pink:#E7EDEE; --pmuted:#94A6AC; --pline:#26343A; --pfield:rgba(120,120,128,.3);
  --gt:#9D97FF; --bzt:#FDBA74; --plumt:#E29BD6; --sess:#86EFAC; --wut:#FCD34D; --gold:#F6C453;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#0E1416; --panel:#161F22; --fg:#E7EDEE; --muted:#94A6AC; --line:#26343A;
  --accent:#9D97FF; --accent-soft:#23214A; --good:#86EFAC; --good-soft:#15301F; --warn:#FDBA74;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#0E1416; --pcard:#161F22; --pink:#E7EDEE; --pmuted:#94A6AC; --pline:#26343A; --pfield:rgba(120,120,128,.3);
  --gt:#9D97FF; --bzt:#FDBA74; --plumt:#E29BD6; --sess:#86EFAC; --wut:#FCD34D; --gold:#F6C453;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
svg.g { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.logo { width: 40px; height: 40px; border-radius: 10px; background: #4F46E5; color: #fff; display: grid; place-items: center; flex: none }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; min-width: 0; align-content: start }
.topnote { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13.5px }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 62ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #4F46E5; border-color: #4F46E5; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

/* Stage = pretend iPhone, 390 x 760, scaled to fit */
.stagebox { position: relative; width: min(100%, 390px); aspect-ratio: 390 / 760; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 6px #1f1f23, var(--shadow); justify-self: center; background: var(--pbg) }
.stage { position: absolute; left: 0; top: 0; width: 390px; height: 760px; transform-origin: 0 0; font-family: var(--f-phone); font-size: 15px; line-height: 1.3; color: var(--pink); background: var(--pbg); overflow: hidden; -webkit-user-select: none; user-select: none }
:where(.stage button) { font: inherit; color: inherit }
:where(.stage input) { font: inherit; color: var(--pink); -webkit-user-select: text; user-select: text }
.sbar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px; font-weight: 600; font-size: 15px; z-index: 40; pointer-events: none; background: linear-gradient(var(--pbg) 70%, transparent) }
.sbar .bat { width: 25px; height: 12px; border: 1.5px solid var(--pink); border-radius: 4px; position: relative; opacity: .8 }
.sbar .bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 70%; background: var(--pink); border-radius: 2px }
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 46px 16px 84px; scrollbar-width: none }
.scr::-webkit-scrollbar { display: none }
.sp { flex: 1 }
.tr { color: var(--gt) }

/* Tab bar: flat, three items, like the app */
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--pcard); border-top: 1px solid var(--pline); display: flex; align-items: flex-start; padding-top: 6px; z-index: 30 }
.tabs button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--pmuted); cursor: pointer; padding: 0 }
.tabs button svg { width: 24px; height: 24px }
.tabs button.on { font-weight: 600 }

/* Navigation */
.ltop { display: flex; align-items: center; min-height: 40px }
.nbk { display: flex; align-items: center; border: 0; background: none; color: var(--acc); font-size: 16px; padding: 4px 0; cursor: pointer; min-height: 40px }
.nbk svg { width: 20px; height: 20px }
.ltitle { margin: 0 0 8px; font-size: 32px; line-height: 1.12; font-weight: 700 }
.inl { display: flex; align-items: center; min-height: 40px; margin-bottom: 4px }
.inl b { flex: 1; text-align: center; font-size: 17px }
.inl .l, .inl .r { width: 80px; display: flex }
.inl .r { justify-content: flex-end }
.ib { border: 0; background: none; padding: 6px; cursor: pointer; display: grid; place-items: center; color: var(--gt); border-radius: 10px }
.ib svg { width: 22px; height: 22px }
.cap { color: var(--pmuted); font-size: 12.5px; margin: 4px 0 }

/* Train */
.gcard { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: var(--ind); color: #fff; border-radius: 18px; padding: 18px 10px 18px 12px; cursor: pointer; text-align: left; margin-bottom: 10px }
.gcard b { display: block; font-size: 22px; line-height: 1.15 }
.gcard small { display: block; font-size: 15px; opacity: .85; white-space: nowrap }
.gcard svg.g { width: 34px; height: 34px }
.sess { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; border-radius: 10px; padding: 7px 10px; background: rgba(21,128,61,.12); color: var(--sess); font-weight: 600; font-size: 14px; text-align: left; margin: 0 0 10px }
.sess i { width: 9px; height: 9px; border-radius: 50%; background: var(--sess); flex: none }
button.sess { cursor: pointer }
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.wt { position: relative }
.wtb { display: flex; flex-direction: column; width: 100%; min-height: 128px; border: 0; border-radius: 18px; padding: 12px; text-align: left; cursor: pointer }
.wtb svg.g { width: 30px; height: 30px }
.wtb b { font-size: 17px; margin-top: auto; line-height: 1.2 }
.wtb .row2 { display: flex; align-items: flex-end; gap: 6px; font-size: 12px; opacity: .9 }
.wtb .pl { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none }
.wtb .pl svg { width: 13px; height: 13px; fill: currentColor; stroke: none }
.wt .pen { position: absolute; right: 6px; top: 6px; width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; cursor: pointer }
.wt .pen svg { width: 17px; height: 17px }
.newt { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 128px; width: 100%; border: 1.5px dashed var(--acc); border-radius: 18px; background: rgba(47,111,224,.06); color: var(--acc); font-weight: 600; font-size: 15px; cursor: pointer }
.newt svg { width: 30px; height: 30px }
.note2 { display: flex; align-items: center; gap: 10px; background: var(--pcard); border: 1.5px solid var(--red); border-radius: 14px; padding: 10px; margin-bottom: 10px }
.note2 b { display: block; font-size: 15px }
.note2 small { display: block; color: var(--pmuted); font-size: 12.5px; line-height: 1.3 }
.capb { border: 0; border-radius: 16px; padding: 6px 12px; font-weight: 700; font-size: 15px; cursor: pointer; flex: none }

/* Gym */
.gmenu { display: inline-flex; align-items: center; gap: 6px; border: 0; background: rgba(79,70,229,.12); border-radius: 18px; padding: 6px 10px; color: var(--gt); font-weight: 600; font-size: 17px; cursor: pointer }
.gmenu svg { width: 12px; height: 12px; stroke-width: 2.4 }
.intro { color: var(--pmuted); font-size: 15px; margin: 8px 0 }
.donel { display: flex; align-items: flex-start; gap: 8px; color: var(--gt); font-weight: 600; font-size: 15px; margin: 0 0 10px }
.donel svg { width: 16px; height: 16px; margin-top: 2px }
.h3 { font-size: 17px; font-weight: 600; margin: 4px 0 6px; color: var(--gt) }
.h3.bz { color: var(--bzt) }
.h3 .link { float: right; border: 0; background: none; color: var(--gt); font-weight: 600; font-size: 15px; cursor: pointer }
.acts { display: flex; gap: 8px; margin: 2px 0 10px }
.act { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 14px; min-height: 44px; padding: 6px; background: rgba(79,70,229,.14); color: var(--gt); font-weight: 600; font-size: 13px; line-height: 1.15; text-align: left; cursor: pointer }
.act.main { background: var(--ind); color: #fff }
.act svg { width: 16px; height: 16px }
.plan { background: var(--pcard); border: 1px solid rgba(79,70,229,.5); border-radius: 14px; overflow: hidden }
.prow { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 7px 12px; text-align: left; cursor: pointer }
.prow + .prow { border-top: 1px solid var(--pline) }
.prow.nx { background: rgba(79,70,229,.08) }
.num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: rgba(79,70,229,.14); color: var(--gt); flex: none }
.num.nx { background: var(--ind); color: #fff }
.prow .nm { font-size: 16px }
.prow .nm.sk { color: var(--pmuted); text-decoration: line-through }
.prow small { display: block; font-size: 12px; color: var(--gt) }
.prow small.bz { color: var(--bzt) } .prow small.dn { color: var(--pmuted) }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.mt { position: relative; border-radius: 14px }
.mtb { position: relative; display: block; width: 100%; height: 132px; border: 1px solid var(--pline); border-radius: 14px; overflow: hidden; padding: 0; background: rgba(79,70,229,.1); cursor: pointer; text-align: left; color: var(--gt) }
.mt.dn .mtb { border: 2px solid var(--ind) } .mt.bz .mtb { border: 2px solid var(--bz) }
.mtb .ph { position: absolute; inset: 0 0 44px 0; display: grid; place-items: center }
.mtb .ph svg { width: 56px; height: 56px }
.mtb .band { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(30,27,75,.82); color: #fff; padding: 5px 8px; height: 44px }
.mt.bz .band { background: var(--bz); color: var(--bz-ink) }
.band b { display: block; font-size: 14.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.band span { display: block; font-size: 12px; opacity: .88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mtb .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 5px }
.mt .tk2 { position: absolute; right: 6px; top: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--ind); color: #fff; display: grid; place-items: center }
.mt .tk2 svg { width: 14px; height: 14px; stroke-width: 2.4 }
.busyp { position: absolute; right: 6px; bottom: 50px; display: flex; align-items: center; gap: 2px; border: 1px solid var(--bz); background: var(--pcard); color: var(--bzt); border-radius: 12px; height: 22px; padding: 0 6px; font-size: 11px; font-weight: 600; cursor: pointer }
.busyp.on { background: var(--bz); color: var(--bz-ink); border-color: var(--bz) }
.busyp svg { width: 11px; height: 11px }
.nmt { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 142px; width: 100%; border: 1.5px dashed var(--ind); border-radius: 14px; background: rgba(79,70,229,.08); color: var(--gt); font-weight: 600; font-size: 15px; cursor: pointer; text-align: center }
.nmt svg { width: 34px; height: 34px }
.bigb { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border: 0; border-radius: 17px; background: var(--ind); color: #fff; font-weight: 700; font-size: 20px; font-family: ui-rounded, "SF Pro Rounded", var(--f-phone); cursor: pointer }
.bigb svg { width: 22px; height: 22px; stroke-width: 2.3 }
.bigb.soft { background: var(--pcard); color: var(--pink); border: 1px solid var(--pline) }
.bigb.nav { background: var(--navy) }
.vlist { background: var(--pcard); border: 1px solid var(--pline); border-radius: 14px; overflow: hidden }
.vrow { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 8px 12px; text-align: left; cursor: pointer }
.vrow + .vrow { border-top: 1px solid var(--pline) }
.vrow b { display: block; font-size: 16px }
.vrow small { display: block; font-size: 14px; color: var(--pmuted) }
.vrow svg { width: 14px; height: 14px; color: var(--pmuted) }

/* Machine */
.ph2 { height: 90px; border-radius: 10px; background: rgba(79,70,229,.1); color: var(--gt); display: grid; place-items: center }
.ph2 svg { width: 38px; height: 38px }
.setl { font-weight: 600; font-size: 14.5px; color: var(--gt); margin: 6px 0 2px }
.lastl { color: var(--pmuted); font-size: 14.5px; margin: 2px 0 }
.sugg { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; background: rgba(79,70,229,.12); font-size: 14.5px; margin: 8px 0 }
.sugg svg { width: 20px; height: 20px; color: var(--gt) }
.sets { background: rgba(79,70,229,.09); border: 1px solid rgba(79,70,229,.35); border-radius: 14px; overflow: hidden; margin: 8px 0 }
.srow { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 7px 12px; text-align: left; cursor: pointer; font-size: 16px }
.srow + .srow { border-top: 1px solid var(--pline) }
.srow .lb { color: var(--pmuted) } .srow .lb.w { color: var(--wut); display: flex; align-items: center; gap: 4px }
.srow .lb svg { width: 15px; height: 15px }
.srow b { font-weight: 600 } .srow b.w { font-weight: 400; color: var(--pmuted) }
.srow .up { width: 16px; height: 16px; color: var(--gold); stroke-width: 2.4 }
.tkc { width: 20px; height: 20px; border-radius: 50%; background: var(--ind); color: #fff; display: grid; place-items: center; flex: none }
.tkc.w { background: var(--yel); color: var(--yel-ink) }
.tkc svg { width: 11px; height: 11px; stroke-width: 3 }
.entry { background: var(--pcard); border: 1px solid rgba(79,70,229,.5); border-radius: 16px; padding: 12px; margin: 8px 0 }
.eh { display: flex; align-items: center; gap: 8px; margin-bottom: 8px }
.eh b { font-size: 17px; color: var(--gt); flex: 1 }
.eh b.w { color: var(--wut) }
.wpill { display: flex; align-items: center; gap: 4px; border: 1px solid var(--yel); background: none; color: var(--wut); border-radius: 15px; height: 30px; padding: 0 10px; font-weight: 600; font-size: 14px; cursor: pointer }
.wpill.on { background: var(--yel); color: var(--yel-ink) }
.wpill svg { width: 15px; height: 15px }
.nb { display: flex; align-items: center; gap: 4px; font-weight: 600; font-size: 14px; color: var(--gt) }
.nb svg { width: 18px; height: 18px }
.stp { display: flex; align-items: center; gap: 10px; margin: 8px 0 }
.rb { width: 50px; height: 50px; border-radius: 50%; border: 0; background: rgba(79,70,229,.12); color: var(--gt); display: grid; place-items: center; cursor: pointer; flex: none }
.rb svg { width: 22px; height: 22px }
.stp .mid { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 6px }
.stp input { width: 90px; border: 0; background: none; text-align: right; font-size: 34px; font-weight: 700; font-family: ui-rounded, "SF Pro Rounded", var(--f-phone); padding: 0; outline-offset: 2px }
.stp .u { font-size: 17px; font-weight: 600; color: var(--pmuted) }
.btnrow { display: flex; gap: 8px; margin-top: 10px }
.setdone { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 58px; border: 0; border-radius: 19px; background: var(--ind); color: #fff; font-weight: 700; font-size: 22px; font-family: ui-rounded, "SF Pro Rounded", var(--f-phone); cursor: pointer }
.setdone svg { width: 24px; height: 24px; stroke-width: 2.4 }
.nextb { width: 118px; min-height: 58px; border: 0; border-radius: 19px; background: var(--grn); color: var(--grn-ink); font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 0 6px }
.nextb span { font-size: 20px; font-family: ui-rounded, "SF Pro Rounded", var(--f-phone); display: flex; align-items: center; gap: 2px }
.nextb span svg { width: 14px; height: 14px; stroke-width: 2.6 }
.nextb small { font-size: 11px; font-weight: 600; max-width: 100% ; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.restc { background: var(--pcard); border-radius: 16px; padding: 12px; margin: 8px 0; text-align: center }
.ringw { position: relative; width: 180px; height: 180px; margin: 0 auto }
.ringw svg { width: 180px; height: 180px; transform: rotate(-90deg) }
.ringw .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center }
.ringw .c small { font-size: 12px; font-weight: 700; color: var(--pmuted); letter-spacing: .04em }
.ringw .c b { font-size: 52px; line-height: 1; font-weight: 700; font-family: ui-rounded, "SF Pro Rounded", var(--f-phone); font-variant-numeric: tabular-nums }
.restc .nx { color: var(--pmuted); font-size: 14.5px; margin: 8px 0 2px }

/* ---------- Gym screen ---------- */
function tileHTML(m, busy) {
  const n = setsOf(m.id).length, done = n > 0;
  const status = busy ? 'Busy \u2014 come back later' : done ? (m.logs === 'time' ? 'Done today' : n + ' set' + (n === 1 ? '' : 's') + ' done') : lastTxt(m);
  return `<div class="mt${busy ? ' bz' : ''}${done && !busy ? ' dn' : ''}" data-t="tile-${m.id}"><button class="mtb" data-act="open-machine" data-id="${m.id}">

    ${done ? `<span class="tk2">${icon('check', 'g')}</span>` : ''}

}
function planRow(i, id) {

    <span class="sp"><span class="nm${skipped ? ' sk' : ''}"${nx ? ' style="font-weight:600"' : ''}>${esc(m.name)}</span>${st ? `<small class="${busy && !done ? 'bz' : done ? 'dn' : ''}">${st}</small>` : ''}</span>
    ${done ? `<span style="color:var(--gt)">${ico('check', 16)}</span>` : `<span style="color:var(--pmuted)">${ico('chevR', 14)}</span>`}</button>`;
}
function gymHTML() {

function menuHTML() {

/* ---------- Machine screen ---------- */

const RING = 2 * Math.PI * 80;

    <div class="nx">Next: set ${setsOf(m.id).length + 1}${DOT}${esc(setTxt({ kg: nx.kg, reps: nx.reps }, m))}</div><div class="lk">Also on your lock screen</div>

  st.innerHTML = `<div class="sbar"><span>9:41</span><span class="bat"></span></div>${body}${undo}${over}${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ''}`;
  renderStage.keys = {};
  st.querySelectorAll('[data-keep]').forEach(e => { const k = keyOf(e); e.dataset.k = k; renderStage.keys[k] = 1; e.scrollTop = prevKeys[k] ? (scrolls[k] || 0) : 0; });
  if (inId) { const nf = st.querySelector(`[data-in="${inId}"]`); if (nf) { nf.focus(); try { nf.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }

let toastH = null;
function toast(t) { S.toast = t; renderStage(); clearTimeout(toastH); toastH = setTimeout(() => { S.toast = ''; renderStage(); }, 2400); }
const soon = () => toast('Practice copy: not drawn here.');

/* ---------- Timers: the rest (ten times faster here) and the Undo bar (10 seconds, as in the app) ---------- */
const SPEED = 10;
let lastTick = Date.now();
function startRest(left, len, practice) { S.rest = { left, len: len || left, practice: !!practice }; lastTick = Date.now(); }
setInterval(() => {
  const now = Date.now(), dt = (now - lastTick) / 1000; lastTick = now;
  const r = S.rest; if (!r) return;
  r.left -= dt * SPEED;
  if (r.left <= 0) {
    if (r.practice && !solved) { r.left = r.len; toast('The rest ran out. It starts again here, for practice.'); return; }
    S.rest = null; renderStage(); emit('rest-over'); return;
  }
  const f = r.left / Math.max(1, r.len), arc = document.getElementById('ringArc'), tm = document.getElementById('restTime');
  if (arc) { arc.setAttribute('stroke', ringKey(f)); arc.setAttribute('stroke-dashoffset', (RING * (1 - f)).toFixed(1)); }
  if (tm) tm.textContent = clock(r.left);
}, 200);
let undoSeq = 0;
function startUndo(label, restore, practice) {
  const id = ++undoSeq; S.undo = { id, label, restore, practice: !!practice };
  later(() => {
    if (!S.undo || S.undo.id !== id) return;
    if (S.undo.practice && !solved) { startUndo(label, restore, true); toast('The bar lasts 10 seconds and has gone. Here it is again, for practice.'); }
    else { S.undo = null; renderStage(); }
  }, 10000);
  renderStage();
}

    case 'unread-backups': S.page = 'backups'; renderStage(); emit('backups-open'); break;
    case 'page-back': if (S.tab === 'train') S.page = S.page === 'backups' ? null : null; else S.spage = null; renderStage(); break;
    case 'backup-now': S.sheet = 'share'; renderStage(); emit('backup-now'); break;

}

/* ---------- Tour engine (reusable) ---------- */
let ci = 0, si = 0, solved = false, targetOff = false;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let doneChapters = new Set(JSON.parse(store.get('workoutstour-done') || '[]'));

function emit(name, data) {
  const st = LESSONS[ci]?.steps[si]; if (!st || solved || st.kind !== 'try') return;
  if (st.on && st.on[name]) { markTarget(st.on[name]); }
  if ((st.wait === name || st.alt === name) && (!st.when || st.when(data))) succeed(st.ok);
}
function succeed(msg) {
  solved = true; targetOff = true; const fb = document.getElementById('fb'); if (fb) { fb.textContent = '\u2713 ' + msg; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
  markTarget();
}
let curTarget = null;
function markTarget(t) {
  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  const q = n => document.querySelector(`#stage [data-t="${CSS.escape(n)}"]`);
  // If the thing to tap is out of sight (a stray tap closed a page), point at the way back to it.
  const first = LESSONS[ci] && LESSONS[ci].steps[si] && LESSONS[ci].steps[si].target;
  const el = q(curTarget) || (first && first !== curTarget ? q(first) : null)
    || (S.alert ? q('alert-cancel') : S.sheet ? q('sheet-cancel') : S.page === 'machine' ? q('machine-pill') : (S.page || S.spage) ? q('page-back') : S.tab !== 'train' ? q('tab-train') : null);
  if (el) {
    el.classList.add('target');
    const sc = el.closest('.scr');
    if (sc) { const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect(), k = document.getElementById('stagebox').clientWidth / 390;
      if (r.top < s.top + 40 * k || r.bottom > s.bottom - 110 * k) sc.scrollTop += (r.top - s.top - 120 * k) / k; }
  }
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand"><span class="logo">${icon('kettle')}</span><div><h1>Workouts Tour</h1><small>Learn the app in about 15 minutes</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '\u2713' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('phone')}<span>Now on your iPhone</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Practice copy, nothing changes in your real app. Based on AMS Workouts 1.21.</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; clearTimers(); S = START();
  const L = LESSONS[i]; if (L && L.setup) L.setup();
  renderStep();
}
function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  clearTimers(); clearTimeout(toastH);
  if (st.setup) st.setup();
  S.toast = '';
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">\u00B7 ${kindName} \u00B7 step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('workoutstour-done', JSON.stringify([...doneChapters]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {

    'Tap "New machine or exercise", then "Skip photo" (or take a photo), give it a name and press Save. Check that you stay on the gym screen.',
    'Tap "Finish this session", type a title and press Done. Then open the History tab and find the session.',
    'Open Settings \u2192 Backups and press "Back up now": save the file to Files or iCloud Drive. Then open Settings \u2192 Check my data and see "All good".'];
  let ticks = JSON.parse(store.get('workoutstour-real') || '[]');
  fin.innerHTML = `<h3>Now on your iPhone</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('workoutstour-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 390 x 760 pretend iPhone into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 390})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.alert) { act('restore-cancel'); return; }
    if (S.sheet === 'summary') { act('sum-undo'); return; }
    if (S.sheet && ['plan', 'mform', 'nextTime', 'setEdit', 'share', 'picker'].includes(S.sheet)) { S.sheet = null; renderStage(); return; }
  }
  if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); }
});
goChapter(0); fit();
</script>
