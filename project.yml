# XcodeGen spec — run `xcodegen generate`, then open AMSWorkoutCompanion.xcodeproj.
# iPhone (portrait), iPad and — as the iPad app — the Mac (since 3.0).
name: AMSWorkoutCompanion
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.1"
    # Build number, short since 1.19 (his ask): 1 for each new version, then 2, 3 … for another build of it.
    CURRENT_PROJECT_VERSION: "1"
packages:
  # The model — workouts, their phases and the clock, with no screen in it.
  WorkoutCore:
    path: Core
  # The shared AMS icon hub: hand-drawn icons, the colour palette, IconMark and IconTile.
  # Pinned to one commit (the hub has no version tags yet), so a hub change never
  # reaches this app by surprise.
  AMSIcons:
    url: https://github.com/marsch124/AMS-Icons
    revision: 089121f5be32406f60908b5f3e0120da79a1e8c7
targets:
  AMSWorkoutCompanion:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Shared
    dependencies:
      - package: WorkoutCore
      - package: AMSIcons
      - target: RestWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSWorkoutCompanion
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: App/Config/AMSWorkoutCompanion.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # 3.0: the app's own iCloud folder, where iPhone, iPad and Mac meet.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.schabbauer.AMSWorkoutCompanion]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.schabbauer.AMSWorkoutCompanion]
        # 3.1: the notes shared with AMS Triathlon Training — the app's own group first, then the training app's.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.schabbauer.AMSWorkoutCompanion
          - $(AppIdentifierPrefix)com.schabbauer.AMSWorkoutSync
    info:
      path: App/Config/Info.plist
      properties:
        # The name under the icon: "AMS WorkoutCompanion" is too long for the home screen, and
        # Apple refuses "Companion" (error 90129: the name of one of its own apps).
        CFBundleDisplayName: Workout Companion
        CFBundleName: AMS WorkoutCompanion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: A photo of each gym machine, so you recognise it and its setting next time.
        # 2.0: the heart rate of a warm-up, read from Apple Health (a Garmin watch writes it there through Garmin Connect).
        NSHealthShareUsageDescription: Reads your heart rate during a warm-up, so the warm-up shows how hard you worked.
        # Apple asks for this sentence too whenever Apple Health is switched on; the app never writes to Health.
        NSHealthUpdateUsageDescription: Workout Companion does not write anything to Apple Health; it only reads your heart rate during a warm-up.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The iPad turns every way (Apple refuses an iPad app that does not: error 90474).
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The rest on the lock screen and in the Dynamic Island (since 1.15).
        NSSupportsLiveActivities: true
        # 3.1: amsworkouts://open brings the app to the front; amsworkoutsync is the training app, asked about for "Open Triathlon".
        CFBundleURLTypes:
          - CFBundleURLName: com.schabbauer.AMSWorkoutCompanion
            CFBundleURLSchemes: [amsworkouts]
        LSApplicationQueriesSchemes: [amsworkoutsync]
  # Draws the rest on the lock screen and in the Dynamic Island (since 1.15).
  RestWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: App/Shared
    dependencies:
      - package: WorkoutCore
      - package: AMSIcons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSWorkoutCompanion.RestWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Widget/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: Widget/Config/Info.plist
      properties:
        CFBundleDisplayName: Workout Companion
        CFBundleName: RestWidget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AMSWorkoutCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AMSWorkoutCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSWorkoutCompanionUITests
        TEST_TARGET_NAME: AMSWorkoutCompanion
schemes:
  AMSWorkoutCompanion:
    build:
      targets:
        AMSWorkoutCompanion: all
    test:
      targets:
        - AMSWorkoutCompanionUITests
        - package: WorkoutCore/WorkoutCoreTests
