# XcodeGen spec — run `xcodegen generate`, then open AMSWorkoutCompanion.xcodeproj.
# iPhone only, portrait.
name: AMSWorkoutCompanion
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # The model — workouts, their phases and the clock, with no screen in it.
  WorkoutCore:
    path: Core
targets:
  AMSWorkoutCompanion:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: WorkoutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSWorkoutCompanion
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Config/Info.plist
      properties:
        # The name under the icon: "AMS WorkoutCompanion" is too long for the home screen.
        CFBundleDisplayName: Companion
        CFBundleName: AMS WorkoutCompanion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  AMSWorkoutCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AMSWorkoutCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSWorkoutCompanionUITests
        TEST_TARGET_NAME: AMSWorkoutCompanion
schemes:
  AMSWorkoutCompanion:
    build:
      targets:
        AMSWorkoutCompanion: all
    test:
      targets:
        - AMSWorkoutCompanionUITests
        - package: WorkoutCore/WorkoutCoreTests
