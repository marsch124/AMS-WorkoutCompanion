# XcodeGen spec — run `xcodegen generate`, then open AMSWorkoutCompanion.xcodeproj.
# iPhone only, portrait.
name: AMSWorkoutCompanion
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.10"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # The model — workouts, their phases and the clock, with no screen in it.
  WorkoutCore:
    path: Core
  # The shared AMS icon hub: hand-drawn icons, the colour palette, IconMark and IconTile.
  # Pinned to one commit (the hub has no version tags yet), so a hub change never
  # reaches this app by surprise.
  AMSIcons:
    url: https://github.com/marsch124/AMS-Icons
    revision: 089121f5be32406f60908b5f3e0120da79a1e8c7
targets:
  AMSWorkoutCompanion:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: WorkoutCore
      - package: AMSIcons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSWorkoutCompanion
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Config/Info.plist
      properties:
        # The name under the icon: "AMS WorkoutCompanion" is too long for the home screen, and
        # Apple refuses "Companion" (error 90129: the name of one of its own apps).
        CFBundleDisplayName: Workouts
        CFBundleName: AMS WorkoutCompanion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: A photo of each gym machine, so you recognise it and its setting next time.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  AMSWorkoutCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AMSWorkoutCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSWorkoutCompanionUITests
        TEST_TARGET_NAME: AMSWorkoutCompanion
schemes:
  AMSWorkoutCompanion:
    build:
      targets:
        AMSWorkoutCompanion: all
    test:
      targets:
        - AMSWorkoutCompanionUITests
        - package: WorkoutCore/WorkoutCoreTests
