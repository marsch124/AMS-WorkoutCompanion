name: TestFlight

# Archive the app and send it to TestFlight from GitHub's Mac — no Mac of his needed.
# Started on request only: Actions → TestFlight → Run workflow. It ships only a version
# whose tests already passed after its push (they are not run a second time).
#
# Signing is done by an App Store Connect API key held as three repository
# secrets. The build number is short (since 1.19): CURRENT_PROJECT_VERSION in project.yml,
# 1 for a new version, 2, 3 … for another build of the same version — the same as an upload from the Mac.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upload:
    # Apple refuses anything built with an SDK older than iOS 26; this image has Xcode 26.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: This version passed its tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OK=$(gh api "repos/${{ github.repository }}/actions/workflows/tests.yml/runs?head_sha=${{ github.sha }}&status=success" --jq '.total_count')
          if [ "$OK" = "0" ]; then
            echo "::error::The tests have not passed for ${GITHUB_SHA:0:7} yet — wait for the Tests run after the push, then start this again."
            exit 1
          fi
          echo "Tests passed for ${GITHUB_SHA:0:7}."

      - name: Check the three secrets are there
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ]    || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing — add them under Settings → Secrets and variables → Actions (see TESTFLIGHT.md)."
            exit 1
          fi

      - name: Put the key where xcodebuild looks for it
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Use the newest Xcode on this runner
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Which build this is
        run: |
          BUILD=$(grep CURRENT_PROJECT_VERSION project.yml | head -1 | cut -d'"' -f2)
          VERSION=$(grep MARKETING_VERSION project.yml | head -1 | cut -d'"' -f2)
          echo "Building $VERSION ($BUILD) from ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          # Signed ad hoc ("-"): asking Apple for a real certificate here mints one
          # per runner and fills the account. The
          # export below re-signs for distribution with the App Store Connect key.
          xcodebuild archive \
            -project AMSWorkoutCompanion.xcodeproj \
            -scheme AMSWorkoutCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AMSWorkoutCompanion.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            EXPANDED_CODE_SIGN_IDENTITY="-"

      # tools/ExportOptions.plist carries destination=upload, so this step is the upload.
      - name: Export and send it to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath build/AMSWorkoutCompanion.xcarchive \
            -exportOptionsPlist tools/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "$VERSION ($BUILD) is on its way to TestFlight. Apple takes a few minutes to process it."

      - name: Keep the log when it goes red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build
          path: build/export
          if-no-files-found: ignore
          retention-days: 5
